<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Origami Brew Log</title>
<meta name="description" content="Pour-over recipes tuned to each bean, adjusted by how the cup tasted. Origami, Hario V60 and Kalita Wave with a Comandante C40.">
<meta name="theme-color" content="#2A1B13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brew Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Noto+Serif+TC:wght@600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* base reset */
html{color-scheme:light dark;-webkit-text-size-adjust:100%}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
header.top{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: café menu meets brew bar. A warm stone page; each Brew view opens with a full-bleed roast-brown "recipe board" band (serif bean name, crema readouts, a C40 dial); below it, paper cards for brew-along, notes and the cup log. */
:root{
  --paper:#EFE9E1;       /* stone paper */
  --card:#FBF8F4;
  --sunk:#E6DED3;
  --ink:#24170F;
  --muted:#76665A;
  --line:#DCD1C4;
  --crema:#B87A32;       /* brass / crema accent */
  --crema-soft:#F1E0C8;
  --coffee:#5A3320;
  --leaf:#3F7A55; --warn:#A8661A; --bad:#A63D32;
  --hero:#2A1B13; --hero-2:#36241A; --hero-ink:#F5EBDD; --hero-muted:#C2AE99; --hero-line:rgba(245,235,221,.14); --hero-crema:#E2AE67;
  --f-display:"Young Serif","Noto Serif TC",Georgia,"Times New Roman",serif;
  --f-body:"Hanken Grotesk","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono","Noto Sans TC",ui-monospace,"SF Mono",Menlo,monospace;
  --r-lg:18px; --r:12px; --r-sm:8px;
  --shadow:0 1px 0 rgba(36,23,15,.04),0 8px 24px -12px rgba(36,23,15,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15100C;--card:#1E1712;--sunk:#271E18;--ink:#F1E6D8;--muted:#A8968A;--line:#33281F;
  --crema:#DDA65F;--crema-soft:#3A2A1A;--coffee:#B07A55;--leaf:#79B78E;--warn:#E1A157;--bad:#E5877C;
  --hero:#251811;--hero-2:#302017;--hero-ink:#F5EBDD;--hero-muted:#BBA690;--hero-line:rgba(245,235,221,.12);--hero-crema:#E8B572;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15100C;--card:#1E1712;--sunk:#271E18;--ink:#F1E6D8;--muted:#A8968A;--line:#33281F;
  --crema:#DDA65F;--crema-soft:#3A2A1A;--coffee:#B07A55;--leaf:#79B78E;--warn:#E1A157;--bad:#E5877C;
  --hero:#251811;--hero-2:#302017;--hero-ink:#F5EBDD;--hero-muted:#BBA690;--hero-line:rgba(245,235,221,.12);--hero-crema:#E8B572;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.005em}
:lang(zh-Hant-TW) h1,:lang(zh-Hant-TW) h2,:lang(zh-Hant-TW) h3{font-weight:600}
h2{font-size:clamp(1.6rem,3.2vw,2.1rem);line-height:1.15}
h3{font-size:1.2rem;line-height:1.25}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--muted)}
:lang(zh-Hant-TW) .eyebrow{letter-spacing:.06em}
button{font:600 .9rem var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .1s}
button:hover{border-color:var(--muted)}
button:active{transform:translateY(1px)}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
button.primary:hover{background:var(--coffee);border-color:var(--coffee)}
button.ghost{background:transparent;border-color:transparent;color:var(--crema);padding-inline:8px}
button.ghost:hover{text-decoration:underline;text-underline-offset:3px}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--crema);outline-offset:2px}
a{color:var(--crema)}

/* header */
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-size:1.3rem}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--hero);display:grid;place-items:center;flex:none}
nav.tabs{display:flex;gap:2px}
nav.tabs button{border:0;background:transparent;border-radius:0;padding:8px 12px;color:var(--muted);font-weight:600;position:relative}
nav.tabs button::after{content:"";position:absolute;left:12px;right:12px;bottom:-13px;height:2px;border-radius:2px;background:transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"]::after{background:var(--crema)}
.lang{display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--muted);font-size:.78rem;padding:5px 10px}
.lang button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.notice{font-size:.84rem;color:var(--warn);padding-top:12px}
@media (max-width:640px){.topin{gap:10px}.brand h1{font-size:1.1rem}nav.tabs{order:3;width:100%;justify-content:space-between}nav.tabs button{flex:1}nav.tabs button::after{bottom:-12px}}

main{padding-bottom:64px}
.stack{display:flex;flex-direction:column;gap:24px;padding-top:28px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px}
@media (max-width:520px){.card{padding:18px;border-radius:var(--r)}}

/* chips & tags */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.74rem;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600;white-space:nowrap}
.chip.ex{background:var(--crema-soft);color:var(--crema)}
.tag{font-size:.78rem;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink)}

/* ---------- HERO (recipe board) ---------- */
.hero{background:radial-gradient(120% 140% at 85% 0%,var(--hero-2) 0%,var(--hero) 55%);color:var(--hero-ink);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:4px 4px;pointer-events:none}
.hero .wrap{position:relative;padding-block:32px 36px;display:flex;flex-direction:column;gap:24px}
.hero .eyebrow{color:var(--hero-muted)}
.hero-top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.hero-title{min-width:0;flex:1 1 360px;display:flex;flex-direction:column;gap:8px}
.beanpick{position:relative;display:inline-flex;align-items:center;max-width:100%}
.beanpick select{field-sizing:content;appearance:none;-webkit-appearance:none;font:400 clamp(1.9rem,4.4vw,3rem)/1.1 var(--f-display);color:var(--hero-ink);background:transparent;border:0;padding:0 34px 2px 0;max-width:100%;text-overflow:ellipsis;cursor:pointer}
:lang(zh-Hant-TW) .beanpick select{font-weight:600}
.beanpick select option{color:#24170F;background:#FBF8F4;font:400 1rem var(--f-body)}
.beanpick svg{position:absolute;right:4px;pointer-events:none}
.hero-sub{color:var(--hero-muted);font-size:.92rem}
.hero-sub a{color:var(--hero-crema)}
.hero .chip{background:rgba(245,235,221,.1);color:var(--hero-ink)}
.hero .chip.ex{background:rgba(226,174,103,.18);color:var(--hero-crema)}
.hero button{background:rgba(245,235,221,.08);border-color:var(--hero-line);color:var(--hero-ink)}
.hero button:hover{border-color:rgba(245,235,221,.4)}
.hero button.primary{background:var(--hero-crema);border-color:var(--hero-crema);color:#24170F}
.hero button.primary:hover{background:#EDC48A}
.roastdot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 2px rgba(245,235,221,.15)}

.seg{display:flex;flex-wrap:wrap;gap:4px;background:rgba(0,0,0,.22);border:1px solid var(--hero-line);padding:4px;border-radius:999px;width:fit-content;max-width:100%}
.seg button{border:0;background:transparent;color:var(--hero-muted);padding:7px 14px;font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--hero-ink);color:#24170F}
@media (max-width:640px){.seg{flex-wrap:nowrap;overflow-x:auto;border-radius:14px;scrollbar-width:none}.seg button{white-space:nowrap;flex:none}}
.seg button svg{vertical-align:-3px;margin-right:6px}

.board{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.board{grid-template-columns:1fr}}
.readouts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--hero-line);border:1px solid var(--hero-line);border-radius:var(--r-lg);overflow:hidden}
.ro{background:var(--hero);padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ro .eyebrow{display:flex;align-items:center;gap:8px}
.ro .v{font-family:var(--f-mono);font-size:clamp(2rem,4.4vw,2.8rem);line-height:1;font-variant-numeric:tabular-nums;color:var(--hero-ink);letter-spacing:-.02em}
.ro .v small{font-size:.42em;color:var(--hero-muted);margin-left:4px;letter-spacing:0}
.ro.accent .v{color:var(--hero-crema)}
.ro .s{font-size:.8rem;color:var(--hero-muted)}
.delta{font-family:var(--f-mono);font-size:.7rem;padding:2px 7px;border-radius:999px;background:rgba(226,174,103,.16);color:var(--hero-crema);letter-spacing:0}
.thermo{height:4px;border-radius:2px;background:linear-gradient(90deg,#6B8FB0,#D9A35E 55%,#C2492E);position:relative;margin-top:4px}
.thermo i{position:absolute;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--hero-ink);border:2px solid var(--hero);transform:translateX(-50%)}
.ratiobar{display:flex;gap:2px;height:4px;margin-top:4px}
.ratiobar b{background:var(--hero-crema);border-radius:2px}
.ratiobar span{flex:1;background:rgba(160,200,230,.35);border-radius:2px}

.dose{display:flex;align-items:baseline;gap:4px}
.dose input{flex:none;font:400 clamp(2rem,4.4vw,2.8rem)/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--hero-crema);background:transparent;border:0;border-bottom:1px dashed rgba(245,235,221,.3);border-radius:0;padding:0;letter-spacing:-.02em;-moz-appearance:textfield}
.dose input::-webkit-outer-spin-button,.dose input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dose small{font-family:var(--f-mono);font-size:1.1rem;color:var(--hero-muted)}
.presets{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:2px}
.hero .presets button{padding:3px 10px;font:500 .74rem var(--f-mono);color:var(--hero-muted)}
.hero .presets button[aria-pressed="true"]{background:rgba(226,174,103,.18);border-color:var(--hero-crema);color:var(--hero-crema)}
.hero .presets .step{width:28px;height:28px;padding:0;display:grid;place-items:center;font-size:1rem;color:var(--hero-ink)}
.hero .linkbtn{background:transparent;border:0;padding:0;color:var(--hero-crema);font-size:.8rem}

.dialcard{border:1px solid var(--hero-line);border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(0,0,0,.14);text-align:center}
.dialcard svg{width:100%;max-width:240px;height:auto}
.dialcard .eyebrow{align-self:stretch;display:flex;justify-content:space-between}
.dialcard .t{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;border-top:1px solid var(--hero-line);padding-top:12px;margin-top:4px;width:100%}
.dialcard .t div{display:flex;flex-direction:column;gap:2px}
.dialcard .t b{font:400 1.35rem var(--f-mono);color:var(--hero-ink);font-variant-numeric:tabular-nums}
.dialcard .t span{font-size:.75rem;color:var(--hero-muted)}

/* ---------- brew along ---------- */
.brewalong{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:640px){.brewalong{grid-template-columns:1fr}}
.illus{display:flex;flex-direction:column;align-items:center;gap:14px}
.illus svg{width:100%;max-width:200px;height:auto}
.clock{font:400 3.2rem/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.nownext{font-size:.92rem;color:var(--muted);text-align:center;min-height:2.6em}
.nownext b{color:var(--ink)}
.track{position:relative;height:8px;border-radius:4px;background:var(--sunk);margin:6px 0 2px}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--crema),var(--coffee));width:0}
.track .mk{position:absolute;top:-4px;width:2px;height:16px;background:var(--muted);opacity:.5;border-radius:1px}
.track .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--leaf) 28%,transparent);border-radius:4px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:56px 18px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;position:relative}
.tl li .at{font:500 .9rem var(--f-mono);color:var(--muted);padding-top:1px}
.tl li .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--card);margin-top:5px;position:relative;z-index:1}
.tl li:not(:last-child)::after{content:"";position:absolute;left:calc(56px + 12px + 7px);top:28px;bottom:-6px;width:2px;background:var(--line)}
.tl li .what{font-size:.94rem}
.tl li .to{font:500 1.05rem var(--f-mono);text-align:right;white-space:nowrap}
.tl li .to small{display:block;font-size:.72rem;color:var(--muted);font-weight:400}
.tl li.done .dot{background:var(--crema);border-color:var(--crema)}
.tl li.done .what,.tl li.done .to{color:var(--muted)}
.tl li.now .dot{background:var(--card);border-color:var(--crema);box-shadow:0 0 0 5px color-mix(in srgb,var(--crema) 25%,transparent)}
.tl li.now .what{font-weight:600}
.tl li.now .to{color:var(--crema)}
.agit{font-size:.88rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px;margin:0}
.agit b{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.steam path{animation:steam 2.4s ease-in-out infinite;opacity:0}.steam path:nth-child(2){animation-delay:.8s}.steam path:nth-child(3){animation-delay:1.6s}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.55}100%{opacity:0;transform:translateY(-10px)}}

/* notes */
ul.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.why li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:.94rem}
ul.why li::before{content:"";width:8px;height:8px;margin:7px 0 0 6px;border-radius:50%;background:var(--crema)}
ul.why li:first-child{font-weight:600}
.compass-wrap{display:flex;gap:16px;align-items:center;border-top:1px dashed var(--line);padding-top:16px}
.compass-wrap p{margin:0;font-size:.86rem;color:var(--muted)}

/* compass input */
.compass{display:grid;grid-template-columns:auto 240px;max-width:100%;grid-template-rows:auto auto;gap:6px 8px;align-items:center;max-width:340px}
.compass .yl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;height:100%}
.compass .xl{grid-column:2;max-width:240px;display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.cgrid{position:relative;display:grid;grid-template-columns:repeat(5,1fr);aspect-ratio:1;width:100%;max-width:240px;border-radius:var(--r);overflow:hidden;background:
  radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--leaf) 22%,transparent) 0 14%,transparent 15%),
  linear-gradient(90deg,color-mix(in srgb,#C9A227 18%,transparent),transparent 40% 60%,color-mix(in srgb,var(--coffee) 22%,transparent)),var(--sunk)}
.cgrid::before,.cgrid::after{content:"";position:absolute;background:var(--line);pointer-events:none}
.cgrid::before{left:50%;top:0;bottom:0;width:1px}
.cgrid::after{top:50%;left:0;right:0;height:1px}
.cgrid button{border:0;border-radius:0;background:transparent;padding:0;position:relative;z-index:1}
.cgrid button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.cgrid button[aria-pressed="true"]::after{content:"";position:absolute;inset:28%;border-radius:50%;background:var(--crema);box-shadow:0 0 0 4px color-mix(in srgb,var(--crema) 30%,transparent)}
.cread{font-size:.9rem}
.cread b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.15rem}

.scores{display:flex;gap:4px;flex-wrap:wrap}
.scores button{width:38px;height:38px;padding:0;font:500 .9rem var(--f-mono);border-radius:50%}
.scores button[aria-pressed="true"]{background:var(--crema);border-color:var(--crema);color:#24170F}

/* forms */
form{display:flex;flex-direction:column;gap:18px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:400 .95rem var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--crema)}
textarea{min-height:64px;resize:vertical}
.checks{display:flex;gap:18px;flex-wrap:wrap}
.checks label{display:flex;gap:8px;align-items:center;font-size:.92rem}
.checks input{width:18px;height:18px;accent-color:var(--crema)}
.formsec{display:flex;flex-direction:column;gap:12px}
.import{background:var(--crema-soft);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.import .row>input{flex:1 1 240px;background:var(--card)}
.qrbtn{display:inline-flex;align-items:center;gap:8px}
.btnlink{display:inline-flex;align-items:center;font:600 .9rem var(--f-body);background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 18px;text-decoration:none}
.btnlink[hidden]{display:none}
.steps{margin:0;padding-left:20px;font-size:.86rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.import details summary{cursor:pointer;color:var(--crema);font-weight:600;font-size:.88rem}
.import details[open] summary{margin-bottom:8px}
.import textarea{min-height:110px;font-size:.85rem;background:var(--card)}
.imsg{font-size:.88rem;margin:0}
.imsg.ok{color:var(--leaf)} .imsg.err{color:var(--bad)} .imsg.busy{color:var(--muted)}
.hints{margin:0;padding-left:18px;font-size:.85rem;color:var(--warn)}

/* shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.bag{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;text-align:left;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
.bag:hover{transform:translateY(-2px);border-color:var(--crema)}
.bag[aria-current="true"]{border-color:var(--crema);box-shadow:0 0 0 1px var(--crema),var(--shadow)}
.bag .band{height:84px;position:relative;display:flex;align-items:flex-end;padding:12px 16px;color:#F5EBDD}
.bag .band::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:10px;background:radial-gradient(circle at 5px 0,transparent 5px,var(--card) 5.5px) -5px 0/10px 10px repeat-x}
.bag .band .eyebrow{color:rgba(245,235,221,.85);position:relative;z-index:1}
.bag .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.bag .name{font-family:var(--f-display);font-size:1.3rem;line-height:1.2}
:lang(zh-Hant-TW) .bag .name{font-weight:600}
.bag .origin{font-size:.86rem;color:var(--muted)}
.bag .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.bag .foot b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.bag.add{border-style:dashed;box-shadow:none;background:transparent;align-items:center;justify-content:center;gap:10px;min-height:260px;padding:24px;text-align:center}
.bag.add .plus{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:1.6rem;line-height:1}
.bag.add .name{font-size:1.2rem}

/* history */
.hist{display:flex;flex-direction:column}
.h{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.h:last-child{border-bottom:0}
.scorebox{font:400 1.4rem var(--f-mono);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);position:relative}
.scorebox.best{background:var(--crema);color:#24170F}
.scorebox.best::after{content:"★";position:absolute;top:-4px;right:-4px;font-size:.7rem;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.h .meta{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.h .title{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.h .title strong{font-weight:600}
@media (max-width:560px){.h{grid-template-columns:auto minmax(0,1fr) auto}.h .mini{display:none}}

.empty{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:32px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty strong{font-family:var(--f-display);font-weight:400;font-size:1.3rem;color:var(--ink)}

/* guide */
.lede{max-width:62ch;font-size:1.02rem;color:var(--muted);margin:8px 0 0}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
tbody tr:last-child td{border-bottom:0}
tr.now td{background:var(--crema-soft)}
.tablewrap{overflow-x:auto;margin-inline:-4px}
.guide-table td:first-child{font-weight:600}
.chart{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;font-size:.85rem}
.ctrack{position:relative;height:16px;background:var(--sunk);border-radius:8px}
.cbar{position:absolute;top:0;bottom:0;border-radius:8px;background:var(--line)}
.cbar.me{background:var(--crema)}
.ctick{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.dialscale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.prose p{margin:0 0 10px}

/* guide: taste */
.jump{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 0;margin:-6px 0}
.jump .eyebrow{margin-right:4px}
.jump button{padding:6px 14px;font-size:.84rem;background:var(--card)}
@media (max-width:640px){.jump{position:static}}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0}
.tcard.mine{border-color:var(--crema);box-shadow:0 0 0 1px var(--crema),var(--shadow)}
.tcard p{margin:0;font-size:.93rem}
.tcard-h{display:flex;gap:12px;align-items:flex-start}
.tcard-h .chip{margin-left:auto}
.swatch{width:36px;height:36px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.swatch.pin{display:grid;place-items:center;background:var(--sunk);color:var(--crema);box-shadow:none}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px;background:var(--paper);border-radius:var(--r-sm)}
.meter{display:flex;flex-direction:column;gap:5px;font-size:.72rem;color:var(--muted);font-weight:600}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--crema)}
.ttip{border-top:1px dashed var(--line);padding-top:12px;color:var(--muted);margin-top:auto!important}
.ttip b{color:var(--ink);margin-right:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:20px}
.facts p{margin:6px 0 0;font-size:.93rem}
/* ratings */
.ratings{display:flex;flex-direction:column;gap:6px}
.rate{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:center;font-size:.8rem}
.rname{color:var(--muted);font-weight:600;min-width:4.8em}
.rpips{display:flex;gap:2px}
.rpips button{border:0;background:transparent;padding:2px;border-radius:6px;width:23px;height:26px;display:grid;place-items:center;color:var(--line)}
.rpips button svg{width:16px;height:16px;fill:currentColor}
.rpips button:hover{background:var(--sunk)}
.rate.favourite .rpips button.on{color:#C8483A}
.rate.difficulty .rpips button.on{color:var(--coffee)}
.rlabel{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .ratings{flex-direction:row;flex-wrap:wrap;gap:6px 24px;margin-top:2px}
.hero .rname,.hero .rlabel{color:var(--hero-muted)}
.hero .rpips button{background:transparent;border:0;color:rgba(245,235,221,.22)}
.hero .rpips button:hover{background:rgba(245,235,221,.08)}
.hero .rate.favourite .rpips button.on{color:#F07A6A}
.hero .rate.difficulty .rpips button.on{color:var(--hero-crema)}
.sortsel{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);font-weight:600}
.sortsel select{width:auto;padding:8px 12px;border-radius:999px;background:var(--card)}
/* account */
.acct{position:relative;display:flex;align-items:center}
.signin{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;font-size:.84rem}
.avatar{width:36px;height:36px;padding:0;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--hero);color:var(--hero-ink);border:2px solid var(--line);font-weight:700}
.avatar img{width:100%;height:100%;object-fit:cover}
.acctmenu{position:absolute;right:0;top:calc(100% + 10px);min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;z-index:20}
.acctmenu .who{display:flex;flex-direction:column;gap:2px;font-size:.88rem}
.acctmenu .who span{color:var(--muted);font-size:.8rem}
.acctmenu .synced{color:var(--leaf)!important}
.linkish{background:none;border:0;padding:0;color:var(--crema);text-decoration:underline;text-underline-offset:3px;font-size:inherit}
/* backup */
.backup{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:20px;margin-top:8px}
.backup p{margin:4px 0 0;font-size:.86rem;color:var(--muted);max-width:56ch}
/* scanner */
.scanner{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;justify-content:space-between}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.scan-frame span{width:min(68vw,300px);aspect-ratio:1;border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);border:3px solid #E2AE67}
.scan-top,.scan-bottom{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 16px max(20px,env(safe-area-inset-left,0px));color:#F5EBDD}
.scan-bottom{flex-direction:column;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-top:16px;text-align:center}
.scan-top h2{font-size:1.3rem;color:#F5EBDD}
.scan-bottom p{margin:0;font-size:.95rem}
.scanner button{background:rgba(245,235,221,.14);border-color:rgba(245,235,221,.3);color:#F5EBDD}
.scan-x{width:40px;height:40px;padding:0;font-size:1.1rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:999px;font-size:.9rem;z-index:30;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap topin">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M3 5h18l-6.5 10h-5z" fill="none" stroke="#E2AE67" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 19h8" stroke="#F5EBDD" stroke-width="1.8" stroke-linecap="round"/><path d="M12 15v4" stroke="#F5EBDD" stroke-width="1.8"/></svg></span>
      <h1>Origami Brew Log</h1>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-beans" data-tab="beans">Beans</button>
      <button role="tab" id="tab-brew" data-tab="brew">Brew</button>
      <button role="tab" id="tab-guide" data-tab="guide">Guide</button>
    </nav>
    <div class="lang" role="group" aria-label="Language / 語言">
      <button id="lang-en" data-lang="en" lang="en">EN</button>
      <button id="lang-zh" data-lang="zh" lang="zh-Hant">繁中</button>
    </div>
    <div id="acct" class="acct"></div>
  </div>
</header>
<div class="wrap"><div id="notice" class="notice" hidden></div></div>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>
<input type="file" id="backup-file" accept="application/json,.json" hidden>
<div id="scanner" class="scanner" hidden role="dialog" aria-modal="true" aria-labelledby="scan-title">
  <video id="scan-video" playsinline muted></video>
  <div class="scan-frame" aria-hidden="true"><span></span></div>
  <div class="scan-top"><h2 id="scan-title">Scan the QR code</h2><button type="button" id="scan-close" class="scan-x" data-act="scan-close" aria-label="Cancel">✕</button></div>
  <div class="scan-bottom"><p id="scan-hint">Point at the QR code on the bag.</p><button type="button" id="scan-photo" data-act="scan-photo">Use a photo instead</button></div>
</div>

<script src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
